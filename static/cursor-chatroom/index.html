<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Chatroom - Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        #game-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #chat-panel {
            background: rgba(0, 0, 0, 0.8);
            border-top: 2px solid #00ff00;
            padding: 10px;
            height: 200px;
            display: flex;
            flex-direction: column;
        }
        
        #messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .message {
            margin: 2px 0;
            padding: 2px 5px;
        }
        
        .message.system {
            color: #ffff00;
        }
        
        #input-area {
            display: flex;
            gap: 5px;
        }
        
        #message-input {
            flex: 1;
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        #send-button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 8px 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        
        #send-button:hover {
            background: #00cc00;
        }
        
        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border: 1px solid #00ff00;
            font-size: 12px;
            z-index: 100;
            max-width: 400px;
        }
        
        #info-panel div {
            margin: 3px 0;
        }
        
        .cursor-label {
            position: absolute;
            color: #fff;
            font-size: 12px;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
    </div>
    <div id="chat-panel">
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Type a message..." maxlength="200">
            <button id="send-button">Send</button>
        </div>
    </div>
    <div id="info-panel">
        <div><strong>Cursor Chatroom</strong></div>
        <div id="peer-id">Your ID: Initializing...</div>
        <div id="peer-count">Connected: 0</div>
        <div style="margin-top: 8px;">
            <button id="create-offer-btn" style="padding: 5px 10px; background: #00ff00; color: #000; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-weight: bold;">Create Offer</button>
        </div>
        <div style="margin-top: 5px;">
            <textarea id="connect-input" placeholder="Paste offer/answer here" style="width: 100%; height: 60px; padding: 5px; background: #000; color: #00ff00; border: 1px solid #00ff00; font-family: 'Courier New', monospace; font-size: 11px; resize: vertical;"></textarea>
            <button id="submit-connection-btn" style="padding: 5px 10px; background: #00ff00; color: #000; border: none; cursor: pointer; font-family: 'Courier New', monospace; margin-top: 3px;">Submit</button>
        </div>
        <div id="connection-info" style="margin-top: 10px; display: none;">
            <div style="font-weight: bold; color: #ffff00;"><span id="connection-type"></span>:</div>
            <textarea id="connection-data" readonly style="width: 100%; height: 80px; padding: 5px; background: #000; color: #ffff00; border: 1px solid #ffff00; font-family: 'Courier New', monospace; font-size: 10px; resize: vertical; margin-top: 3px;"></textarea>
            <button id="copy-btn" style="padding: 3px 8px; background: #ffff00; color: #000; border: none; cursor: pointer; font-family: 'Courier New', monospace; margin-top: 3px;">Copy</button>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let canvasWidth = window.innerWidth;
        let canvasHeight = window.innerHeight - 200;
        
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        // Handle window resize
        window.addEventListener('resize', () => {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight - 200;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        });

        // Generate random color for user
        function randomColor() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#F38181', '#AA96DA', '#FCBAD3', '#A8E6CF'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Generate random username
        function randomUsername() {
            const adjectives = ['Swift', 'Cosmic', 'Quantum', 'Stellar', 'Electric', 'Neon', 'Cyber', 'Digital'];
            const nouns = ['Fox', 'Wolf', 'Eagle', 'Tiger', 'Hawk', 'Dragon', 'Phoenix', 'Lion'];
            return adjectives[Math.floor(Math.random() * adjectives.length)] + 
                   nouns[Math.floor(Math.random() * nouns.length)] + 
                   Math.floor(Math.random() * 100);
        }

        // App state
        const myUsername = randomUsername();
        const myColor = randomColor();
        const myId = 'user-' + Math.random().toString(36).substr(2, 9);
        const cursors = new Map();
        const channels = new Map();
        let mouseX = 0;
        let mouseY = 0;
        let localConnection = null;
        let remoteConnection = null;
        let dataChannel = null;

        // Render loop
        function render() {
            // Clear canvas
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            // Draw my cursor
            drawCursor(ctx, mouseX, mouseY, myColor, myUsername);
            
            // Draw other cursors
            cursors.forEach((cursor, id) => {
                drawCursor(ctx, cursor.x, cursor.y, cursor.color, cursor.username);
            });
            
            requestAnimationFrame(render);
        }
        
        // Draw a cursor
        function drawCursor(context, x, y, color, username) {
            // Draw cursor triangle
            context.fillStyle = color;
            context.strokeStyle = '#000';
            context.lineWidth = 2;
            
            context.beginPath();
            context.moveTo(x, y);
            context.lineTo(x + 15, y + 30);
            context.lineTo(x + 8, y + 25);
            context.closePath();
            context.fill();
            context.stroke();
            
            // Draw username label
            context.fillStyle = color;
            context.font = 'bold 12px "Courier New", monospace';
            context.shadowColor = '#000';
            context.shadowBlur = 3;
            context.fillText(username, x + 20, y + 15);
            context.shadowBlur = 0;
        }

        // Start render loop
        render();

        // Track mouse movement on canvas
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            
            // Broadcast position to all peers
            const message = JSON.stringify({
                type: 'move',
                id: myId,
                x: mouseX,
                y: mouseY
            });
            
            channels.forEach((channel) => {
                if (channel.readyState === 'open') {
                    channel.send(message);
                }
            });
        });

        // WebRTC Configuration
        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Create offer for connection
        async function createOffer() {
            try {
                localConnection = new RTCPeerConnection(configuration);
                dataChannel = localConnection.createDataChannel('chat');
                setupDataChannel(dataChannel);
                
                localConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        const offerData = {
                            type: 'offer',
                            sdp: localConnection.localDescription,
                            candidate: event.candidate
                        };
                        // Display offer for manual sharing
                        displayConnectionInfo('OFFER', JSON.stringify(offerData));
                    }
                };
                
                const offer = await localConnection.createOffer();
                await localConnection.setLocalDescription(offer);
                
                addSystemMessage('Offer created! Copy and share with peer.');
            } catch (error) {
                console.error('Error creating offer:', error);
                addSystemMessage('Error creating offer: ' + error.message);
            }
        }

        // Handle incoming offer/answer
        async function handleConnectionData(data) {
            try {
                const connectionData = JSON.parse(data);
                
                if (connectionData.type === 'offer') {
                    // Create answer
                    remoteConnection = new RTCPeerConnection(configuration);
                    
                    remoteConnection.ondatachannel = (event) => {
                        setupDataChannel(event.channel);
                    };
                    
                    remoteConnection.onicecandidate = (event) => {
                        if (event.candidate) {
                            const answerData = {
                                type: 'answer',
                                sdp: remoteConnection.localDescription,
                                candidate: event.candidate
                            };
                            displayConnectionInfo('ANSWER', JSON.stringify(answerData));
                        }
                    };
                    
                    await remoteConnection.setRemoteDescription(connectionData.sdp);
                    if (connectionData.candidate) {
                        await remoteConnection.addIceCandidate(connectionData.candidate);
                    }
                    
                    const answer = await remoteConnection.createAnswer();
                    await remoteConnection.setLocalDescription(answer);
                    
                    addSystemMessage('Answer created! Copy and send back to peer.');
                } else if (connectionData.type === 'answer') {
                    // Complete connection
                    await localConnection.setRemoteDescription(connectionData.sdp);
                    if (connectionData.candidate) {
                        await localConnection.addIceCandidate(connectionData.candidate);
                    }
                    addSystemMessage('Connection established!');
                }
            } catch (error) {
                console.error('Error handling connection:', error);
                addSystemMessage('Error: ' + error.message);
            }
        }

        // Setup data channel
        function setupDataChannel(channel) {
            const channelId = Math.random().toString(36).substr(2, 9);
            channels.set(channelId, channel);
            
            channel.onopen = () => {
                addSystemMessage('Data channel opened!');
                updatePeerCount();
                
                // Send initial data
                channel.send(JSON.stringify({
                    type: 'init',
                    id: myId,
                    username: myUsername,
                    color: myColor,
                    x: mouseX,
                    y: mouseY
                }));
            };
            
            channel.onmessage = (event) => {
                handlePeerData(event.data);
            };
            
            channel.onclose = () => {
                addSystemMessage('Data channel closed');
                channels.delete(channelId);
                updatePeerCount();
            };
            
            channel.onerror = (error) => {
                console.error('Data channel error:', error);
            };
        }

        // Handle incoming peer data
        function handlePeerData(data) {
            try {
                const message = JSON.parse(data);
                
                switch (message.type) {
                    case 'init':
                        cursors.set(message.id, {
                            username: message.username,
                            color: message.color,
                            x: message.x,
                            y: message.y
                        });
                        addSystemMessage(`${message.username} joined!`);
                        break;
                    case 'move':
                        if (cursors.has(message.id)) {
                            cursors.get(message.id).x = message.x;
                            cursors.get(message.id).y = message.y;
                        }
                        break;
                    case 'message':
                        addChatMessage(message.username, message.message, message.color);
                        break;
                }
            } catch (error) {
                console.error('Error handling peer data:', error);
            }
        }

        // Chat functionality
        function addSystemMessage(text) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = 'message system';
            messageEl.textContent = `[SYSTEM] ${text}`;
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addChatMessage(username, text, color) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = 'message';
            messageEl.style.color = color;
            messageEl.textContent = `[${username}] ${text}`;
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (!text) return;
            
            // Display own message
            addChatMessage(myUsername, text, myColor);
            
            // Broadcast to all peers
            const message = JSON.stringify({
                type: 'message',
                id: myId,
                username: myUsername,
                message: text,
                color: myColor
            });
            
            channels.forEach((channel) => {
                if (channel.readyState === 'open') {
                    channel.send(message);
                }
            });
            
            input.value = '';
        }

        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Update peer count
        function updatePeerCount() {
            document.getElementById('peer-count').textContent = `Connected: ${channels.size}`;
        }

        // Display connection info
        function displayConnectionInfo(type, data) {
            const infoDiv = document.getElementById('connection-info');
            infoDiv.style.display = 'block';
            document.getElementById('connection-type').textContent = type;
            document.getElementById('connection-data').value = data;
        }

        // UI Buttons
        document.getElementById('create-offer-btn').addEventListener('click', createOffer);
        
        document.getElementById('submit-connection-btn').addEventListener('click', () => {
            const data = document.getElementById('connect-input').value.trim();
            if (data) {
                handleConnectionData(data);
                document.getElementById('connect-input').value = '';
            } else {
                addSystemMessage('Please paste connection data');
            }
        });
        
        document.getElementById('copy-btn').addEventListener('click', () => {
            const textarea = document.getElementById('connection-data');
            textarea.select();
            document.execCommand('copy');
            addSystemMessage('Copied to clipboard!');
        });

        // Initial message
        addSystemMessage('Welcome to Cursor Chatroom!');
        addSystemMessage('Your username: ' + myUsername);
        addSystemMessage('Move your mouse to see your cursor.');
        addSystemMessage('To connect: 1) Click "Create Offer" 2) Share the offer 3) Paste answer back');
        addSystemMessage('Or paste someone else\'s offer to join their room.');
        
        document.getElementById('peer-id').textContent = `Your ID: ${myId}`;
    </script>
</body>
</html>
